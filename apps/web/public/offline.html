<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#203a28" />
    <title>You’re offline | ArewaVanta</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f5ef;
        color: #203a28;
        font-family: Manrope, system-ui, sans-serif;
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #d8dfd4;
        border-radius: 20px;
        background: #fffefa;
        box-shadow: 0 20px 60px #203a2814;
      }
      img { width: 56px; height: 56px; border-radius: 14px; }
      p { margin: 24px 0 8px; color: #ad4939; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(28px, 8vw, 38px); line-height: 1.08; }
      main > span { display: block; margin-top: 12px; color: #59675b; line-height: 1.65; }
      button {
        width: 100%;
        min-height: 50px;
        margin-top: 24px;
        border: 0;
        border-radius: 10px;
        background: #31583a;
        color: white;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon-192.png" alt="" width="56" height="56" />
      <p>ArewaVanta</p>
      <h1>You’re offline right now.</h1>
      <span>Reconnect to the internet to load the latest scrim schedule, results and squad standings.</span>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
