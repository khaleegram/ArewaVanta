services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - arewavanta-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  api:
    build: &api-build
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment: &api-environment
      APP_NAME: ArewaVanta
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
      APP_URL: ${APP_URL:-https://api.arewavanta.com}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Lagos}
      FRONTEND_URL: ${FRONTEND_URL:-https://arewavanta.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://arewavanta.com}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      PUBLIC_READ_RATE_LIMIT: ${PUBLIC_READ_RATE_LIMIT:-120}
      PUBLIC_SEARCH_RATE_LIMIT: ${PUBLIC_SEARCH_RATE_LIMIT:-30}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      MAIL_MAILER: smtp
      MAIL_SCHEME: smtp
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-resend}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD to the Resend API key}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set MAIL_FROM_ADDRESS on the verified domain}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ArewaVanta}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@arewavanta.com}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000);exit($$s?0:1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend

  scheduler:
    build: *api-build
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *api-environment
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.api.production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.arewavanta.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - arewavanta-caddy-data:/data
      - arewavanta-caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - edge

volumes:
  arewavanta-postgres:
  arewavanta-caddy-data:
  arewavanta-caddy-config:

networks:
  edge:
  backend:
